name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 設定 Xcode 16.2 版本 (React Native 0.86+ 要求 >= 16.1)
        run: |
          sudo xcode-select -s /Applications/Xcode_16.2.app
          xcodebuild -version

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安裝依賴套件
        run: npm ci || npm install

      - name: 產生 iOS 原生專案 (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: 配置 Podfile 停用原生庫簽名 (防止 Xcode 16 Privacy Bundle 報錯)
        run: |
          node -e "
          const fs = require('fs');
          let content = fs.readFileSync('ios/Podfile', 'utf8');
          const bypassCode = \`
              installer.generated_projects.each do |project|
                project.targets.each do |target|
                  target.build_configurations.each do |config|
                    config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                    config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                    config.build_settings['CODE_SIGN_IDENTITY'] = ''
                  end
                end
              end
          \`;
          content = content.replace(/post_install do \|installer\|/, 'post_install do |installer|' + bypassCode);
          fs.writeFileSync('ios/Podfile', content);
          console.log('Podfile signing bypass configured.');
          "

      - name: 安裝 CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 使用 Xcode 編譯並歸檔 (Archive) 未簽名 iOS 原生應用程式
        run: |
          xcodebuild archive \
            -workspace ios/superscan.xcworkspace \
            -scheme superscan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/superscan.xcarchive \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: 打包成標準 iOS .ipa 檔案 (給 Sideloadly 側載)
        run: |
          APP_PATH=$(find build/superscan.xcarchive/Products/Applications -name "*.app" | head -n 1)
          echo "找到原生 App: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r superscan.ipa Payload
          echo "打包完成，superscan.ipa 檔案大小："
          ls -lh superscan.ipa

      - name: 上傳 superscan.ipa 供下載
        uses: actions/upload-artifact@v4
        with:
          name: superscan-ios-app
          path: superscan.ipa
          retention-days: 7
