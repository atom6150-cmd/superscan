name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 檢查 Xcode 與 Swift 版本 (macos-15 預設支援 Swift 6.2)
        run: |
          xcodebuild -version
          swift --version

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安裝依賴套件
        run: npm ci || npm install

      - name: 產生 iOS 原生專案 (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: 配置 Podfile 與 Xcode 專案停用程式碼簽名與腳本沙盒 (確保未簽名打包順暢)
        run: |
          node -e "
          const fs = require('fs');
          
          // 1. 修改 Podfile 關閉簽名並關閉腳本沙盒
          let podfile = fs.readFileSync('ios/Podfile', 'utf8');
          const bypassCode = \`
              installer.generated_projects.each do |project|
                project.targets.each do |target|
                  target.build_configurations.each do |config|
                    config.build_settings['ENABLE_USER_SCRIPT_SANDBOXING'] = 'NO'
                    config.build_settings['CODE_SIGNING_ALLOWED'] = 'NO'
                    config.build_settings['CODE_SIGNING_REQUIRED'] = 'NO'
                    config.build_settings['CODE_SIGN_IDENTITY'] = ''
                  end
                end
              end
          \`;
          podfile = podfile.replace(/post_install do \|installer\|/, 'post_install do |installer|' + bypassCode);
          fs.writeFileSync('ios/Podfile', podfile);
          console.log('Podfile signing & sandboxing bypass configured.');

          // 2. 修改主專案 project.pbxproj 停用沙盒與強制開發者團隊檢查
          const pbxPath = 'ios/superscan.xcodeproj/project.pbxproj';
          if (fs.existsSync(pbxPath)) {
            let pbx = fs.readFileSync(pbxPath, 'utf8');
            pbx = pbx.replace(/ENABLE_USER_SCRIPT_SANDBOXING = YES;/g, 'ENABLE_USER_SCRIPT_SANDBOXING = NO;');
            pbx = pbx.replace(/CODE_SIGN_STYLE = Automatic;/g, 'CODE_SIGN_STYLE = Manual;');
            pbx = pbx.replace(/CODE_SIGN_IDENTITY = \"[^\"]*\";/g, 'CODE_SIGN_IDENTITY = \"\";');
            pbx = pbx.replace(/CODE_SIGNING_ALLOWED = YES;/g, 'CODE_SIGNING_ALLOWED = NO;');
            fs.writeFileSync(pbxPath, pbx);
            console.log('Project.pbxproj signing & sandboxing bypass configured.');
          }
          "

      - name: 安裝 CocoaPods
        run: |
          cd ios
          pod install --repo-update
          cd ..

      - name: 使用 Xcode 編譯並歸檔 (Archive) 未簽名 iOS 原生應用程式
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/superscan.xcworkspace \
            -scheme superscan \
            -configuration Release \
            -archivePath build/superscan.xcarchive \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log || {
              echo "==================== BUILD ERROR SUMMARY ===================="
              grep -E "(error: |fatal error: |\*\* BUILD FAILED \*\*)" xcodebuild.log || tail -n 80 xcodebuild.log
              echo "============================================================="
              exit 1
            }

      - name: 打包成標準 iOS .ipa 檔案 (給 Sideloadly 側載)
        run: |
          APP_PATH=$(find build/superscan.xcarchive/Products/Applications -name "*.app" | head -n 1)
          echo "找到原生 App: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r superscan.ipa Payload
          echo "打包完成，superscan.ipa 檔案大小："
          ls -lh superscan.ipa

      - name: 上傳 superscan.ipa 供下載
        uses: actions/upload-artifact@v4
        with:
          name: superscan-ios-app
          path: superscan.ipa
          retention-days: 7
