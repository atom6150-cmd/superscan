name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安裝依賴套件
        run: npm ci || npm install

      - name: 產生 iOS 原生專案 (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean

      - name: 安裝 CocoaPods
        run: |
          cd ios
          pod install
          cd ..

      - name: 使用 Xcode 編譯未簽名 iOS 原生應用程式
        run: |
          xcodebuild -workspace ios/superscan.xcworkspace \
            -scheme superscan \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: 打包成標準 iOS .ipa 檔案 (給 Sideloadly 側載)
        run: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/superscan.app Payload/
          zip -r superscan.ipa Payload
          echo "打包完成，superscan.ipa 檔案大小："
          ls -lh superscan.ipa

      - name: 上傳 superscan.ipa 供下載
        uses: actions/upload-artifact@v4
        with:
          name: superscan-ios-app
          path: superscan.ipa
          retention-days: 7
