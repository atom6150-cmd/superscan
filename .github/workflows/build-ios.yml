name: Build iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    runs-on: macos-15
    steps:
      - name: 檢出程式碼
        uses: actions/checkout@v4

      - name: 檢查 Xcode 與 Swift 版本 (macos-15 預設支援 Swift 6.2)
        run: |
          xcodebuild -version
          swift --version

      - name: 安裝 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 安裝依賴套件
        run: npm ci || npm install

      - name: 修復 Swift 6.2 與 Xcode 相容性 (修復 expo-modules-jsi weak let 與 SPM 解析)
        run: node scripts/patch-swift-6.js

      - name: 產生 iOS 原生專案 (Expo Prebuild)
        run: npx expo prebuild --platform ios --clean --no-install

      - name: 配置 Podfile 與 Xcode 專案停用程式碼簽名與腳本沙盒 (確保未簽名打包順暢)
        run: node scripts/patch-podfile.js

      - name: 安裝 CocoaPods
        run: |
          cd ios
          export EXPO_USE_PRECOMPILED_MODULES=0
          export EXPO_USE_SOURCE=1
          pod install --repo-update
          cd ..

      - name: 預先編譯 ExpoModulesJSI.xcframework (跳過 Xcode 內嵌腳本沙盒限制)
        run: |
          set -o pipefail
          cd node_modules/expo-modules-jsi/apple
          export PODS_ROOT="$GITHUB_WORKSPACE/ios/Pods"
          export RN_ROOT="$GITHUB_WORKSPACE/node_modules/react-native"
          export PLATFORM_NAME="iphoneos"
          ./scripts/build-xcframework.sh 2>&1 | tee xcframework.log || {
            echo "==================== BUILD ERROR SUMMARY ===================="
            grep -C 5 -E "(error: |fatal error: )" xcframework.log || tail -n 80 xcframework.log
            echo "============================================================="
            exit 1
          }
          cd "$GITHUB_WORKSPACE"

      - name: 使用 Xcode 編譯並歸檔 (Archive) 未簽名 iOS 原生應用程式
        run: |
          set -o pipefail
          export EXPO_USE_PRECOMPILED_MODULES=0
          export EXPO_USE_SOURCE=1
          xcodebuild archive \
            -workspace ios/superscan.xcworkspace \
            -scheme superscan \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/superscan.xcarchive \
            ENABLE_USER_SCRIPT_SANDBOXING=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            COMPILER_INDEX_STORE_ENABLE=NO 2>&1 | tee xcodebuild.log || {
              echo "==================== MATCHED ERRORS WITH CONTEXT ===================="
              grep -C 10 -E "(error: |fatal error: |\*\* ARCHIVE FAILED \*\*|\*\* BUILD FAILED \*\*)" xcodebuild.log || true
              echo "==================== LAST 100 LINES OF BUILD LOG ===================="
              tail -n 100 xcodebuild.log
              echo "======================================================================"
              exit 1
            }

      - name: 打包成標準 iOS .ipa 檔案 (給 Sideloadly 側載)
        run: |
          APP_PATH=$(find build/superscan.xcarchive/Products/Applications -name "*.app" | head -n 1)
          echo "找到原生 App: $APP_PATH"
          mkdir -p Payload
          cp -r "$APP_PATH" Payload/
          zip -r superscan.ipa Payload
          echo "打包完成，superscan.ipa 檔案大小："
          ls -lh superscan.ipa

      - name: 上傳 superscan.ipa 供下載
        uses: actions/upload-artifact@v4
        with:
          name: superscan-ios-app
          path: superscan.ipa
          retention-days: 7

      - name: 上傳建置日誌 (隨時可供排查)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            xcodebuild.log
            node_modules/expo-modules-jsi/apple/xcframework.log
          retention-days: 3
